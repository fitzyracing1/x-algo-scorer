# Public weights and feature switches mirrored from xai-org/x-algorithm.
#
# Every value below was read directly from the upstream source at the commit
# recorded in `source`. The `param` field is the upstream feature-switch key
# and `file` is the path inside the upstream repo where the default is defined.
#
# IMPORTANT: these weights multiply *per-viewer model-predicted probabilities*
# (P(like), P(reply), ...) produced by models nobody outside X has. A score
# computed from guessed probabilities is a toy, not a prediction.

source:
  repo: https://github.com/xai-org/x-algorithm
  commit: 30647a85a20cbdd114169beb9973680c4dc4f401
  commit_date: "2026-11-14"
  synced_at: "2026-11-15"
  files:
    - home-mixer/params/param.rs   # engagement weights, VMRanker* switches
    - vm-ranker/params.rs          # Dpp* switches

# Engagement-head weights. Each multiplies the predicted probability of that
# action (or a continuous prediction such as expected dwell seconds).
# Source: home-mixer/params/param.rs (used by home-mixer/scorers/value_model.rs
# to build ValueModelWeights, summed in xai-value-model/scoring.rs).
