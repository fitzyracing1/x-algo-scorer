# Situational boosts added to a base weight when the viewer and author follow
# each other (see ValueModelWeights::reply_weight_for / dwell_weight_for in
# xai-value-model/weights.rs).
boosts:
  bidirectional_follow_reply_weight_boost:
    value: 15.0
    param: rust_home_mixer_bidirectional_follow_reply_weight_boost
    file: home-mixer/params/param.rs
  bidirectional_follow_dwell_weight_boost:
    value: 0.0
    param: rust_home_mixer_bidirectional_follow_dwell_weight_boost
    file: home-mixer/params/param.rs

# Constant from xai-value-model/weights.rs (NEGATIVE_SCORES_OFFSET), used by
# offset_score() in xai-value-model/scoring.rs to keep final scores positive.
constants:
  negative_scores_offset:
    value: 0.001
    param: NEGATIVE_SCORES_OFFSET
    file: xai-value-model/weights.rs

# Feature switches around the DPP (determinantal point process) diversity
# re-ranker. These do not change a single post's weighted score; they control
# how the already-scored slate is re-ordered for diversity.
switches:
  dpp_enabled:
    value: true
    param: rust_home_mixer_vm_ranker_dpp_enabled
    file: vm-ranker/params.rs
    note: "true since commit 1b3fec2 (2026-09-23), where the param was introduced"
  topic_dpp_enabled:
    value: false
    param: rust_home_mixer_vm_ranker_topic_dpp_enabled
    file: vm-ranker/params.rs
  dpp_theta:
    value: 0.65
    param: rust_home_mixer_vm_ranker_dpp_theta
    file: vm-ranker/params.rs
  dpp_max_selected_rank:
    value: 150
    param: rust_home_mixer_vm_ranker_dpp_max_selected_rank
    file: vm-ranker/params.rs
  dpp_greedy_order:
    value: false
    param: rust_home_mixer_vm_ranker_dpp_greedy_order
    file: vm-ranker/params.rs
  dpp_window:
    value: 0
    param: rust_home_mixer_vm_ranker_dpp_window
    file: vm-ranker/params.rs
    note: "0 maps to window=None in vm-ranker/scoring/mod.rs, disabling the sliding-window DPP path"
  dpp_window_half_distance:
    value: 0.0
    param: rust_home_mixer_vm_ranker_dpp_window_half_distance
    file: vm-ranker/params.rs
  vm_ranker_send_dpp_history:
    value: true
    param: rust_home_mixer_vm_ranker_send_dpp_history
    file: home-mixer/params/param.rs
    note: "flipped false -> true in commit 30647a8 (2026-11-14); introduced false in 590f392 (2026-11-13)"
  vm_ranker_dpp_history_max_items:
    value: 50
    param: rust_home_mixer_vm_ranker_dpp_history_max_items
    file: home-mixer/params/param.rs
    note: "changed 200 -> 50 in commit 30647a8 (2026-11-14)"
